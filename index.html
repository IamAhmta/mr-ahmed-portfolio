<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ahmed.sys — Mr Ahmed Growth Solutions</title>
<meta name="description" content="Mr Ahmed Growth Solutions builds digital experiences, growth systems and business solutions using strategy, design, technology and AI.">
<meta property="og:title" content="Mr Ahmed Growth Solutions | Digital Growth Strategist & Systems Builder">
<meta property="og:description" content="I build digital systems that help businesses grow.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0C10;
  --panel:#0D1015;
  --panel-2:#111520;
  --off:#EDEFEC;
  --off-dim:#9BA1AC;
  --grey:#5C626D;
  --line:rgba(237,239,236,0.09);
  --line-strong:rgba(237,239,236,0.16);
  --blue:#4C7CFF;
  --blue-dim:rgba(76,124,255,0.12);
  --green:#3ECF8E;
  --amber:#F5B942;
  --red:#F0665A;
  --radius:4px;
  --sidebar-w:272px;
  --topbar-h:52px;
  --tabbar-h:42px;
  --terminal-h:200px;
  --terminal-collapsed-h:34px;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#F7F7F5;
  --panel:#FFFFFF;
  --panel-2:#F0F1EE;
  --off:#0D1015;
  --off-dim:#4B4F57;
  --grey:#83878E;
  --line:rgba(13,16,21,0.10);
  --line-strong:rgba(13,16,21,0.18);
  --blue:#2F5CE0;
  --blue-dim:rgba(47,92,224,0.08);
  --green:#1F9D66;
  --amber:#B3800C;
  --red:#C6392E;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--off);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; font-weight:600; color:var(--off);}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit;}
input,textarea,select{font-family:inherit; font-size:0.95rem; color:var(--off); background:transparent;}
::selection{background:var(--blue); color:#fff;}
a:focus-visible, button:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--blue); outline-offset:1px;}

/* ---------------- shell layout ---------------- */
#ide{
  height:100vh; height:100dvh;
  display:grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: calc(var(--topbar-h) + env(safe-area-inset-top,0px)) 1fr;
}
@media(max-width:899px){ #ide{ grid-template-columns: 1fr; } }

.topbar{
  grid-column:1/3; grid-row:1;
  display:flex; align-items:center; justify-content:space-between;
  padding:env(safe-area-inset-top,0px) 16px 0 16px;
  border-bottom:1px solid var(--line);
  background:var(--panel);
}
@media(max-width:899px){ .topbar{ grid-column:1/2; } }
.topbar-left{display:flex; align-items:center; gap:10px; min-width:0; height:var(--topbar-h);}
.topbar-left .root{font-family:'Space Grotesk'; font-weight:600; font-size:0.92rem; white-space:nowrap;}
.topbar-left .root span{color:var(--blue);}
.crumb-sep{color:var(--grey); font-size:0.8rem;}
.topbar-left .crumb{font-family:'JetBrains Mono'; font-size:0.82rem; color:var(--off-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topbar-right{display:flex; align-items:center; gap:10px; height:var(--topbar-h);}
.status-chip{display:flex; align-items:center; gap:7px; font-family:'JetBrains Mono'; font-size:0.74rem; color:var(--off-dim); padding:6px 10px; border:1px solid var(--line-strong); border-radius:20px;}
.status-chip .dot{width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(62,207,142,0.15);}
.kbtn{display:none; align-items:center; gap:8px; font-family:'JetBrains Mono'; font-size:0.76rem; color:var(--grey); border:1px solid var(--line-strong); padding:6px 10px; border-radius:var(--radius);}
@media(min-width:640px){.kbtn{display:flex;}}
.cta-btn{display:inline-flex; align-items:center; gap:8px; background:var(--off); color:var(--bg); font-size:0.82rem; font-weight:600; padding:9px 16px; border-radius:var(--radius); white-space:nowrap;}
.cta-btn:hover{background:var(--blue); color:#fff;}
.icon-btn{width:32px; height:32px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line-strong); border-radius:var(--radius);}
.icon-btn:hover{border-color:var(--off-dim);}
.sidebar-toggle{display:flex;}
@media(min-width:900px){.sidebar-toggle{display:none;}}

/* ---------------- sidebar ---------------- */
.sidebar{
  grid-column:1; grid-row:2;
  background:var(--panel); border-right:1px solid var(--line);
  overflow-y:auto; padding:16px 0 16px;
  font-family:'JetBrains Mono';
}
@media(max-width:899px){
  .sidebar{
    position:fixed; top:calc(var(--topbar-h) + env(safe-area-inset-top,0px)); left:0; bottom:0; width:min(84vw,320px); z-index:150;
    transform:translateX(-105%); transition:transform .3s cubic-bezier(.6,0,.2,1);
    box-shadow:20px 0 60px rgba(0,0,0,0.5);
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-scrim{position:fixed; inset:0; top:calc(var(--topbar-h) + env(safe-area-inset-top,0px)); background:rgba(0,0,0,0.5); z-index:140; opacity:0; pointer-events:none; transition:opacity .3s;}
  .sidebar-scrim.open{opacity:1; pointer-events:auto;}
}
.sidebar-label{font-size:0.68rem; letter-spacing:0.08em; color:var(--grey); padding:4px 18px 10px;}
.tree-item{display:flex; align-items:center; gap:9px; padding:7px 18px; font-size:0.82rem; color:var(--off-dim); cursor:pointer; border-left:2px solid transparent; white-space:nowrap;}
.tree-item:hover{background:var(--panel-2); color:var(--off);}
.tree-item.active{background:var(--blue-dim); color:var(--off); border-left-color:var(--blue);}
.tree-item .fi{width:14px; flex-shrink:0; opacity:0.7;}
.tree-folder{padding:7px 18px; font-size:0.82rem; color:var(--off-dim); display:flex; align-items:center; gap:8px; cursor:pointer;}
.tree-folder:hover{color:var(--off);}
.tree-folder .chev{transition:transform .2s; font-size:0.7rem; opacity:0.6;}
.tree-folder.closed .chev{transform:rotate(-90deg);}
.tree-children{overflow:hidden;}
.tree-children .tree-item{padding-left:38px;}
.tree-status{width:6px; height:6px; border-radius:50%; margin-left:auto; flex-shrink:0;}

/* ---------------- main column ---------------- */
.maincol{grid-column:2; grid-row:2; display:flex; flex-direction:column; min-width:0; min-height:0;}
@media(max-width:899px){ .mainol, .maincol{grid-column:1;} }
.mainCol,.mainCol2{}

.tabbar{
  height:var(--tabbar-h); flex-shrink:0; display:flex; align-items:stretch; overflow-x:auto;
  border-bottom:1px solid var(--line); background:var(--bg);
}
.tab{
  display:flex; align-items:center; gap:8px; padding:0 14px; font-family:'JetBrains Mono'; font-size:0.78rem;
  color:var(--grey); border-right:1px solid var(--line); white-space:nowrap; flex-shrink:0; cursor:pointer;
  background:transparent; border-top:2px solid transparent;
}
.tab.active{color:var(--off); background:var(--panel); border-top-color:var(--blue);}
.tab .x{opacity:0.5; padding:2px;}
.tab .x:hover{opacity:1;}

.content{flex:1; min-height:0; overflow-y:auto; background:var(--panel); scroll-behavior:smooth;}
.file-body{max-width:860px; margin:0 auto; padding:56px 28px 90px;}
@media(min-width:640px){.file-body{padding:72px 40px 100px;}}
.file-tag{font-family:'JetBrains Mono'; font-size:0.72rem; color:var(--grey); margin-bottom:20px;}
.file-tag .path{color:var(--blue);}

.next-link{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:64px; padding-top:24px; border-top:1px solid var(--line); font-family:'JetBrains Mono'; font-size:0.8rem; color:var(--grey);}
.next-link a{color:var(--off); display:flex; align-items:center; gap:8px;}
.next-link a:hover{color:var(--blue);}

/* ---------------- terminal ---------------- */
.terminal{
  flex-shrink:0; border-top:1px solid var(--line); background:#000;
  height:var(--terminal-h); display:flex; flex-direction:column; transition:height .25s ease;
}
.terminal.collapsed{height:var(--terminal-collapsed-h);}
.terminal-bar{
  height:var(--terminal-collapsed-h); flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 14px; font-family:'JetBrains Mono'; font-size:0.74rem; color:var(--grey); cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.terminal-bar:hover{color:var(--off-dim);}
.terminal-out{flex:1; overflow-y:auto; padding:10px 14px; font-family:'JetBrains Mono'; font-size:0.8rem; color:#B7BCC4; display:flex; flex-direction:column; gap:4px;}
.terminal-out .line{white-space:pre-wrap; word-break:break-word;}
.terminal-out .cmd{color:var(--off);}
.terminal-out .cmd::before{content:'$ '; color:var(--green);}
.terminal-out .err{color:var(--red);}
.terminal-out .ok{color:var(--green);}
.terminal-input-row{display:flex; align-items:center; gap:8px; padding:8px 14px; border-top:1px solid rgba(255,255,255,0.06); flex-shrink:0;}
.terminal-input-row .prompt{color:var(--green); font-family:'JetBrains Mono'; font-size:0.8rem;}
.terminal-input-row input{flex:1; font-family:'JetBrains Mono'; font-size:0.8rem; color:var(--off); background:none; border:none; outline:none;}

/* ---------------- content pieces reused across files ---------------- */
.eyebrow-mono{font-family:'JetBrains Mono'; font-size:0.74rem; color:var(--blue); display:flex; align-items:center; gap:9px;}
.eyebrow-mono .dot{width:6px; height:6px; border-radius:50%; background:var(--green);}
.btn{display:inline-flex; align-items:center; gap:9px; padding:12px 22px; border:1px solid var(--line-strong); border-radius:var(--radius); font-size:0.88rem; font-weight:500; transition:all .2s ease;}
.btn:hover{border-color:var(--blue); color:var(--blue);}
.btn.primary{background:var(--off); color:var(--bg); border-color:var(--off);}
.btn.primary:hover{background:var(--blue); border-color:var(--blue); color:#fff;}
.btn svg{transition:transform .2s;}
.btn:hover svg{transform:translate(2px,-2px);}

.tag{display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono'; font-size:0.68rem; padding:4px 10px; border-radius:20px; border:1px solid var(--line-strong);}
.tag.live{color:var(--green); border-color:rgba(62,207,142,0.35);}
.tag.progress{color:var(--amber); border-color:rgba(245,185,66,0.35);}
.tag.soon{color:var(--grey); border-color:var(--line-strong);}
.tag.archived{color:var(--grey); border-color:var(--line-strong); opacity:.6;}
.tag .dot{width:5px; height:5px; border-radius:50%; background:currentColor;}

.pcard{display:block; border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:14px; transition:border-color .2s;}
.pcard:hover{border-color:var(--blue);}
.pcard-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.pcard-meta{font-family:'JetBrains Mono'; font-size:0.72rem; color:var(--grey); margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;}

.kv-grid{display:grid; grid-template-columns:1fr; gap:1px; background:var(--line); border:1px solid var(--line); margin-top:8px;}
@media(min-width:640px){.kv-grid.two-col{grid-template-columns:1fr 1fr;}}
.kv-row{background:var(--panel); padding:18px 20px;}
.kv-key{font-family:'JetBrains Mono'; font-size:0.72rem; color:var(--grey); margin-bottom:4px;}
.kv-val{font-size:0.95rem;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.chip{font-family:'JetBrains Mono'; font-size:0.76rem; border:1px solid var(--line); padding:6px 12px; border-radius:16px; color:var(--off-dim);}

/* ---------------- mini analytics chart (services page) ---------------- */
.svc-chart{ display:flex; align-items:flex-end; gap:3px; height:34px; flex-shrink:0; }
.svc-chart span{
  width:5px; border-radius:2px 2px 0 0; flex-shrink:0;
  background:linear-gradient(180deg, var(--blue), rgba(76,124,255,0.15));
  transform-origin:bottom; animation:barGrow .7s cubic-bezier(.2,.8,.2,1) backwards;
}
@keyframes barGrow{ from{ transform:scaleY(0); opacity:0; } to{ transform:scaleY(1); opacity:1; } }
@media(prefers-reduced-motion: reduce){ .svc-chart span{ animation:none; } }
@media(max-width:520px){ .svc-chart{ display:none; } }

/* ---------------- services photo cards ---------------- */
.svc-photo-grid{ display:grid; grid-template-columns:1fr; gap:20px; margin-top:36px; }
@media(min-width:720px){ .svc-photo-grid{ grid-template-columns:1fr 1fr; } }
.svc-photo-card{
  position:relative; border-radius:8px; overflow:hidden; aspect-ratio:4/5;
  background-size:cover; background-position:center; border:1px solid var(--line-strong);
}
.svc-photo-overlay{
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(10,12,16,0.05) 0%, rgba(10,12,16,0.55) 55%, rgba(10,12,16,0.94) 100%);
}
.svc-photo-content{ position:absolute; left:0; right:0; bottom:0; padding:26px; }
.svc-photo-idx{ font-family:'JetBrains Mono'; font-size:0.7rem; color:var(--blue); opacity:0; transform:translateY(16px); transition:opacity .6s ease, transform .6s ease; }
.svc-photo-title{ font-family:'Space Grotesk'; font-weight:600; font-size:1.3rem; color:#fff; margin-top:8px; opacity:0; transform:translateY(20px); transition:opacity .6s ease .08s, transform .6s ease .08s; }
.svc-photo-desc{ color:rgba(255,255,255,0.78); font-size:0.9rem; margin-top:10px; max-width:340px; opacity:0; transform:translateY(20px); transition:opacity .6s ease .16s, transform .6s ease .16s; }
.svc-photo-card.in .svc-photo-idx, .svc-photo-card.in .svc-photo-title, .svc-photo-card.in .svc-photo-desc{ opacity:1; transform:translateY(0); }
@media(prefers-reduced-motion: reduce){
  .svc-photo-idx, .svc-photo-title, .svc-photo-desc{ opacity:1 !important; transform:none !important; transition:none !important; }
}

.log-row{display:grid; grid-template-columns:1fr; gap:8px; border-left:2px solid var(--line); padding:4px 0 26px 20px; position:relative;}
.log-row::before{content:''; position:absolute; left:-5px; top:6px; width:8px; height:8px; border-radius:50%; background:var(--blue);}
.log-ts{font-family:'JetBrains Mono'; font-size:0.72rem; color:var(--grey);}

.field{margin-bottom:16px;}
.field label{display:block; font-family:'JetBrains Mono'; font-size:0.74rem; color:var(--grey); margin-bottom:6px;}
.field label::before{content:'--'; color:var(--blue); margin-right:4px;}
.field input, .field textarea, .field select{width:100%; border:1px solid var(--line-strong); border-radius:var(--radius); padding:11px 13px; background:var(--panel-2);}
.field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue);}
.field textarea{resize:vertical; min-height:100px;}

.filter-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
.fbtn{font-family:'JetBrains Mono'; padding:7px 13px; border:1px solid var(--line-strong); border-radius:16px; font-size:0.74rem; color:var(--off-dim);}
.fbtn.active{background:var(--off); color:var(--bg); border-color:var(--off);}

.device{border:1px solid var(--line-strong); border-radius:8px; background:var(--panel-2); overflow:hidden;}
.device-bar{display:flex; gap:6px; padding:10px 12px; border-bottom:1px solid var(--line);}
.device-bar span{width:7px; height:7px; border-radius:50%; background:var(--line-strong);}
.device-screen{padding:20px; min-height:220px;}

.hidden{display:none !important;}
.rv{opacity:0; transform:translateY(10px); transition:opacity .5s ease, transform .5s ease;}
.rv.in{opacity:1; transform:none;}
@media(prefers-reduced-motion: reduce){.rv{opacity:1 !important; transform:none !important; transition:none !important;}}

.hero-frame{border:1px solid var(--line-strong); border-radius:6px; overflow:hidden; position:relative;}
.hero-frame img{width:100%; height:100%; object-fit:cover;}

/* circular avatar with animated ring */
.avatar-wrap{position:relative; width:112px; height:112px; flex-shrink:0;}
.avatar-ring{position:absolute; inset:-8px; border-radius:50%; border:1px dashed var(--line-strong); animation:spin 18s linear infinite;}
.avatar-ring::after{content:''; position:absolute; top:-3px; left:50%; width:6px; height:6px; margin-left:-3px; border-radius:50%; background:var(--blue); box-shadow:0 0 8px 2px var(--blue-dim);}
.avatar-photo{width:112px; height:112px; border-radius:50%; overflow:hidden; border:1px solid var(--line-strong); position:relative; z-index:1;}
.avatar-photo img{width:100%; height:100%; object-fit:cover;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@media(prefers-reduced-motion: reduce){.avatar-ring{animation:none;}}

.type-line{display:inline-flex; align-items:baseline; font-family:'Space Grotesk'; font-weight:600;}
.type-cursor{display:inline-block; width:0.5ch; margin-left:2px; background:var(--blue); animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
@media(prefers-reduced-motion: reduce){.type-cursor{animation:none;}}

.social-btn{display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border:1px solid var(--line-strong); border-radius:var(--radius); font-size:0.82rem; color:var(--off-dim); transition:all .2s ease;}
.social-btn:hover{border-color:var(--blue); color:var(--blue);}
.social-code{font-family:'JetBrains Mono'; font-size:0.68rem; font-weight:600; width:20px; height:20px; border-radius:4px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; flex-shrink:0;}

/* command palette */
#palette-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:300; display:flex; align-items:flex-start; justify-content:center; padding-top:12vh;}
#palette{width:min(560px,92vw); background:var(--panel); border:1px solid var(--line-strong); border-radius:8px; box-shadow:0 30px 80px rgba(0,0,0,0.5); overflow:hidden;}
#palette input{width:100%; padding:16px 18px; font-family:'JetBrains Mono'; font-size:0.9rem; border:none; border-bottom:1px solid var(--line); background:transparent;}
#palette-list{max-height:320px; overflow-y:auto;}
.palette-item{display:flex; align-items:center; gap:10px; padding:12px 18px; font-family:'JetBrains Mono'; font-size:0.82rem; color:var(--off-dim); cursor:pointer;}
.palette-item:hover, .palette-item.sel{background:var(--blue-dim); color:var(--off);}

/* ---------------- polaroid gallery (real project screenshots) ---------------- */
.polaroid-grid{display:flex; flex-wrap:wrap; gap:32px; padding:14px 4px 26px;}
.polaroid{
  background:#fdfdfb; padding:12px 12px 22px; width:250px; flex-shrink:0;
  box-shadow:0 20px 44px -14px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.25);
  transition:transform .25s ease, box-shadow .25s ease; cursor:default;
}
.polaroid:nth-child(3n+1){ transform:rotate(-2.2deg); }
.polaroid:nth-child(3n+2){ transform:rotate(1.6deg); }
.polaroid:nth-child(3n){ transform:rotate(-0.8deg); }
.polaroid:hover{ transform:rotate(0deg) translateY(-4px) scale(1.035); box-shadow:0 28px 60px -16px rgba(0,0,0,0.6); z-index:2; }
.polaroid img{ width:100%; display:block; background:#111; }
.polaroid-caption{
  font-family:'Georgia','Space Grotesk',serif; font-style:italic; color:#2b2b2b;
  font-size:0.8rem; text-align:center; margin-top:12px; line-height:1.4; padding:0 4px;
}
@media(max-width:600px){ .polaroid{ width:44vw; } }
</style>
</head>
<body>
